name: macOS build and tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_performance:
        description: Measure large document layout and input validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      MACDIFF_RUN_PERFORMANCE_TESTS: ${{ inputs.run_performance && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Test core and macOS application behavior
        shell: bash
        run: |
          set -o pipefail
          set +e
          swift test --jobs 3 2>&1 | tee tests.log
          test_result=${PIPESTATUS[0]}
          set -e
          {
            echo '### Swift test result'
            echo '```text'
            tail -n 160 tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$test_result"
      - name: Build and verify a development app bundle
        shell: bash
        run: |
          set -o pipefail
          ./scripts/build-app.sh debug 2>&1 | tee build.log
      - name: Retain validation logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-validation-macdiff
          path: |
            tests.log
            build.log
          retention-days: 7
